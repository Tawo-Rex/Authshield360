<!DOCTYPE html>
<html>
<head>
    <title>AuthShield 360 - Admin Action</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AuthShield 360</h1>

        <h2>Sensitive Action Authorized</h2>

        <p>
            Step-up authentication was successfully
            completed.
        </p>

        <p>
            Administrator:
            <strong>{{ username }}</strong>
        </p>

        <div class="success">
            <strong>
                Sensitive administrator function authorized.
            </strong>
        </div>

        <p>
            The action was recorded in the security log.
        </p>

        <br>

        <a href="/admin/system">
            Return to System Configuration
        </a>

        <br><br>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>

</div>

</body>
</html>
