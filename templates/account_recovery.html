<!DOCTYPE html>
<html>
<head>
    <title>AuthShield 360 - Account Recovery</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AuthShield 360</h1>

        <h2>Account Recovery</h2>

        <p>
            Forgot your username or password?
        </p>

        <p>
            Enter the email address registered to your account.
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if message %}
        <div class="success">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('account_recovery') }}">

            <label for="email">
                Registered Email
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
                autocomplete="email"
            >

            <br><br>

            <button type="submit">
                Continue
            </button>

        </form>

        <br>

        <a href="{{ url_for('login') }}">
            Back to Login
        </a>

    </div>

</div>

</body>
</html>
