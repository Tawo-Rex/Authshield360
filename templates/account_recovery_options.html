<!DOCTYPE html>
<html>
<head>
    <title>AuthShield 360 - Recovery Options</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AuthShield 360</h1>

        <h2>Account Recovery</h2>

        <p>
            Your email address has been successfully verified.
        </p>

        <p>
            Verified account:
            <strong>{{ username }}</strong>
        </p>

        <hr>

        <h3>Choose a Recovery Action</h3>

        <p>
            Select what you want to recover.
        </p>

        <br>

        <a href="/account-recovery/reset-password">
            <button type="button">
                Reset Password
            </button>
        </a>

        <br><br>

        <a href="/account-recovery/reset-mfa">
            <button type="button">
                Reset MFA
            </button>
        </a>

        <br><br>

        <a href="/login">
            <button type="button">
                Cancel
            </button>
        </a>

    </div>

</div>

</body>
</html>
