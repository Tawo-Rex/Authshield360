<!DOCTYPE html>
<html>
<head>
    <title>AuthShield 360 - Reset Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AuthShield 360</h1>

        <h2>Reset Password</h2>

        <p>
            Account:
            <strong>{{ username }}</strong>
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label>New Password</label>
            <br>

            <input
                type="password"
                name="password"
                minlength="8"
                required
                autocomplete="new-password"
            >

            <br><br>

            <label>Confirm New Password</label>
            <br>

            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
            >

            <br><br>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <br>

        <a href="/account-recovery/options">
            Cancel
        </a>

    </div>

</div>

</body>
</html>
